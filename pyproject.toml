[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "graphlink"
dynamic = ["version"]
description = "A local-first, graph-based AI workspace for branching reasoning, tool use, and multi-provider workflows."
readme = "README.md"
license = { file = "LICENSE" }
requires-python = ">=3.10"
dependencies = [
    "anthropic",
    "beautifulsoup4",
    # Qt-removal target architecture (doc/QT_REMOVAL_PLAN.md): Python backend
    # + native pywebview shell. PySide6/qtawesome below are scheduled for
    # REMOVAL at the R7 cutover - do not add new Qt dependencies.
    "fastapi",
    "uvicorn",
    "pywebview",
    "ddgs",
    "Markdown",
    "matplotlib",
    "mutagen",
    "ollama",
    "openai>=1.0.0",
    "packaging",
    "Pillow",
    "pygments",
    "pypdf",
    "PySide6",
    "pyspellchecker",
    "python-docx",
    "qtawesome",
    "reportlab",
    "requests",
    "tiktoken",
]

# llama-cpp-python is lazily imported (api_provider._load_llama_cpp_class) only when
# Llama.cpp local mode is actually used - Ollama is the built-in local path, so it is an
# opt-in extra rather than a hard dependency: it is a heavy native build with no wheels
# for newer Python versions, so requiring it would break installs for most users.
[project.optional-dependencies]
llamacpp = ["llama-cpp-python"]
dev = ["pytest", "pytest-env"]

# The suite constructs real QGraphicsObject/QWidget-based nodes and must run
# without a display server (CI runners, this pytest-env setting). QApplication
# picks its platform plugin at construction time from this env var, so it must
# be set before conftest.py's QApplication([]) - pytest-env applies env changes
# before test collection/session start, which is early enough.
[tool.pytest.ini_options]
env = ["QT_QPA_PLATFORM=offscreen"]

[project.gui-scripts]
graphlink = "graphlink_app:main"

[project.urls]
Homepage = "https://github.com/dovvnloading/Graphlink"

# graphlink_app/ has no __init__.py by design (see CONTRIBUTING.md: it is the sys.path
# root, not a package) - modules inside it import each other as flat top-level names
# (e.g. `from graphlink_window import ChatWindow`). package-dir maps graphlink_app/'s
# CONTENTS to the top of the installed distribution so that import style keeps working
# unchanged under an editable/real install; py-modules lists every loose top-level file
# explicitly since setuptools' auto-discovery only picks up real packages (__init__.py
# subdirectories), not loose modules.
[tool.setuptools]
# R7.2: the 17 modules relocated out of graphlink_app/ to the repo root
# (api_provider, graphlink_task_config, graphlink_licensing, ...) are
# deliberately NOT listed here any more - setuptools' build_py only
# consults package_dir[""] to locate a flat py-modules entry, and per-module
# package_dir overrides are silently ignored for modules (they only work for
# real packages), so there is no way to keep listing them here while they
# live outside graphlink_app/. This means a real wheel/sdist build
# (`python -m build`, `pip install -e .`) will not bundle these 17 modules -
# a known, accepted, currently-inert gap: nothing in this project's actual
# pipeline runs `pip install -e .` today (CI only does `pip install -r
# requirements.txt`, which needs no packaging metadata at all), so nothing
# breaks in practice. This closes at the R7.6 cutover, when graphlink_app/
# collapses entirely and this whole package-dir/py-modules scheme gets
# rebuilt in one motion for a flat single-root layout.
py-modules = [
    "graphlink_agents",
    "graphlink_agents_artifact",
    "graphlink_agents_code_sandbox",
    "graphlink_agents_core",
    "graphlink_agents_pycoder",
    "graphlink_agents_tools",
    "graphlink_agents_web",
    "graphlink_app",
    "graphlink_canvas_groups",
    "graphlink_canvas_items",
