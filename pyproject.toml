# R7.2: graphlink_plugins/ moved out of graphlink_app/ WHOLESALE - all 19
# files, including 3 that are still Qt-tainted (graphlink_plugin_context_menu.py,
# graphlink_plugin_portal.py, web_research/worker.py). An earlier version of
# this move tried to leave those 3 behind at the old location to keep the new
# home Qt-pure; that broke at runtime (ModuleNotFoundError), because Python
# resolves a dotted import like `graphlink_plugins.graphlink_plugin_portal`
# against ONE specific `graphlink_plugins` package - whichever directory of
# that name comes first on sys.path - and two same-named packages can never
# coexist. graphlink_plugins/ is therefore NOT 100% Qt-free at its new home;
# that closes at the R7.6 cutover when the 3 remaining Qt files finally get
# deleted along with the rest of graphlink_app/. packages.find's own `where`
# list now searches both roots; the package-dir override below is required
# alongside it - package-dir[""] applies to every discovered package
# regardless of which `where` root found it, so without this entry a real
# build looks for graphlink_plugins under graphlink_app/ (where it no longer
# exists) and fails outright rather than silently mis-packaging.
[tool.setuptools.packages.find]
where = ["graphlink_app", "."]
include = [
    "graphlink_canvas*",
    "graphlink_nodes*",
    "graphlink_plugins*",
    "graphlink_session*",
    "graphlink_ui_dialogs*",
    "graphlink_widgets*",
]

[tool.setuptools.package-dir]
"" = "graphlink_app"
graphlink_plugins = "graphlink_plugins"

# R7.2: this now hard-fails a real `python -m build`/`pip install -e .`
# with `ModuleNotFoundError: graphlink_version` - verified empirically, not
# guessed. setuptools' `attr:` resolution for a bare (non-dotted) module name
# ONLY ever consults package_dir[""] (confirmed by direct testing: even a
# dedicated `graphlink_version = "."` package-dir entry, the same mechanism
# that fixes graphlink_plugins above, does NOT help attr: resolution the way
# it helps packages.find - they are different code paths), so as long as
# package_dir[""] must stay "graphlink_app" for the ~89 modules still there,
# there is no clean way to also point this at graphlink_version.py's new
# repo-root location. Same accepted-gap tier as py-modules above, but more
# severe (a hard failure, not silent under-packaging) - stated plainly so
# nobody is surprised by it. Closes at the R7.6 cutover along with everything
# else in this file keyed to graphlink_app/.
[tool.setuptools.dynamic]
version = { attr = "graphlink_version.APP_VERSION" }
