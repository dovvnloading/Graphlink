name: Formal Lean toolchain spike

on:
  pull_request:
    branches: [main]
    paths:
      - ".github/workflows/formal-lean.yml"
      - "tests/formal_lean_spike/**"
      - "docs/FORMAL_LEAN_TOOLCHAIN_LOCK.md"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: formal-lean-${{ github.event.pull_request.number || github.run_id }}
  cancel-in-progress: true

jobs:
  fixtures:
    name: Replay fixed Lean fixtures (build ${{ matrix.build }})
    runs-on: ubuntu-24.04
    timeout-minutes: 75
    strategy:
      fail-fast: false
      matrix:
        build: [first, second]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Test fixture runner contracts
        run: python3 -m unittest discover -s tests/formal_lean_spike
      - name: Provision the pinned fixture image
        run: bash tests/formal_lean_spike/image/build.sh "$RUNNER_TEMP/formal-lean"
      - name: Run fixtures against the local immutable image
        run: |
          python3 tests/formal_lean_spike/run_spike.py \
            --image-id "$(cat "$RUNNER_TEMP/formal-lean/image-id.txt")" \
            --report "$RUNNER_TEMP/formal-lean/results.json"
      - name: Retain build and replay evidence
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: formal-lean-${{ matrix.build }}
          path: ${{ runner.temp }}/formal-lean/
          if-no-files-found: warn
          retention-days: 14

  reproduce:
    name: Compare image and proof identities across clean builds
    needs: fixtures
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/download-artifact@018cc2cf5baa6db3ef3c5f8a56943fffe632ef53 # v6.0.0
        with:
          pattern: formal-lean-*
          path: ${{ runner.temp }}/evidence
      - name: Compare measured identities and outcomes
        run: |
          python3 tests/formal_lean_spike/compare_runs.py \
            "$RUNNER_TEMP/evidence/formal-lean-first/results.json" \
            "$RUNNER_TEMP/evidence/formal-lean-second/results.json"
