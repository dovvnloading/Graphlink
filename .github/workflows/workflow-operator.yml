name: Workflow operator browser checks

on:
  pull_request:
    branches: [main]
    paths:
      - ".github/workflows/workflow-operator.yml"
      - "backend/workflow/**"
      - "backend/domain/graph_runner.py"
      - "backend/domain/graph_run_*.py"
      - "backend/domain/table_workflows.py"
      - "web_ui/src/app/App.tsx"
      - "web_ui/src/app/chrome/Workflow*"
      - "web_ui/src/app/chrome/workflow*"
      - "web_ui/src/app/chrome/NotificationBanner.tsx"
      - "web_ui/src/app/chrome/GraphRunnerDialog.tsx"
      - "web_ui/src/app/ui/Toast*"
      - "web_ui/src/app/ui/toast.css"
      - "web_ui/src/app/ui/overlay.css"
      - "web_ui/src/app/overlays/**"
      - "web_ui/src/lib/tokens/**"
      - "web_ui/src/lib/workflow-contract/**"
      - "web_ui/e2e/workflow-operator.spec.ts"
      - "web_ui/e2e/table-workflow-helpers.ts"
      - "web_ui/e2e/helpers.ts"
      - "web_ui/playwright.config.ts"
      - "tests_e2e/run_backend.py"
      - "web_ui/package.json"
      - "web_ui/package-lock.json"
      - "web_ui/.nvmrc"
      - "requirements.in"
      - "requirements.txt"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: workflow-operator-${{ github.event.pull_request.number || github.run_id }}
  cancel-in-progress: true

jobs:
  browser:
    name: Workflow operator in Chromium
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.12"
          cache: pip
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: web_ui/.nvmrc
          cache: npm
          cache-dependency-path: web_ui/package-lock.json
      - name: Install backend dependencies
        run: python -m pip install -r requirements.txt
      - name: Install frontend dependencies
        run: npm ci
        working-directory: web_ui
      - name: Build production SPA
        run: npm run build
        working-directory: web_ui
      - name: Install Chromium
        run: npx playwright install --with-deps chromium
        working-directory: web_ui
      - name: Run the Workflow operator production journey
        run: npx playwright test e2e/workflow-operator.spec.ts --project=chromium --workers=1 --retries=0 --trace=retain-on-failure
        working-directory: web_ui
      - name: Preserve workflow review screenshots
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: workflow-operator-review
          path: web_ui/test-results/**/*.png
          if-no-files-found: warn
          retention-days: 14
      - name: Preserve failed workflow browser traces
        if: failure()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: workflow-operator-browser-failure
          path: web_ui/test-results/
          if-no-files-found: warn
          retention-days: 7
