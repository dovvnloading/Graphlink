name: Approval review browser evidence

# Issue #1039 requires repeated, real-backend evidence. Keep this focused
# gate separate from CI's nightly smoke/safety job and unrelated PRs.
on:
  pull_request:
    branches: [main]
    paths:
      - ".github/workflows/approval-review-evidence.yml"
      - "web_ui/e2e-safety/approval-review.spec.ts"
      - "web_ui/playwright.safety.config.ts"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: approval-review-evidence-${{ github.event.pull_request.number || github.run_id }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  browser:
    name: Repeated Python approval review and full safety suite
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.12"
          cache: pip
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: web_ui/.nvmrc
          cache: npm
          cache-dependency-path: web_ui/package-lock.json
      - name: Install locked backend dependencies
        run: python -m pip install -r requirements.txt
      - name: Install locked frontend dependencies
        working-directory: web_ui
        run: npm ci
      - name: Build production SPA
        working-directory: web_ui
        run: npm run build
      - name: Install Playwright Chromium
        working-directory: web_ui
        run: npx playwright install --with-deps chromium
      - name: Repeat focused Python approval review ten times
        id: repeat
        working-directory: web_ui
        run: npm run test:e2e:safety -- --grep "full Python source, existing session grant" --repeat-each=10 --retries=0 --workers=1
      # A new Playwright invocation reuses test-results. Upload before it
      # can overwrite any focused evidence, including a failed repetition.
      - name: Preserve repeated Python review evidence
        if: ${{ !cancelled() && (steps.repeat.outcome == 'success' || steps.repeat.outcome == 'failure') }}
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: repeated-python-approval-review
          path: |
            web_ui/test-results/safety/
            web_ui/test-results/safety-results.json
          if-no-files-found: error
          retention-days: 14
      # Even a failed focused case must not hide independent safety results.
      - name: Run full authenticated approval and review safety suite
        id: safety
        if: ${{ !cancelled() && (steps.repeat.outcome == 'success' || steps.repeat.outcome == 'failure') }}
        working-directory: web_ui
        run: npm run test:e2e:safety -- --retries=0 --workers=1
      - name: Preserve full safety suite evidence
        if: ${{ !cancelled() && (steps.safety.outcome == 'success' || steps.safety.outcome == 'failure') }}
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: full-approval-review-safety
          path: |
            web_ui/test-results/safety/
            web_ui/test-results/safety-results.json
          if-no-files-found: error
          retention-days: 14
