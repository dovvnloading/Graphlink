[plugin]
id = "science_astronomy"
name = "Astronomy"
description = "Propagate Keplerian orbits; transform sky coordinates; compute observing, cosmology, AB photometry and transit quantities."
version = "1.2.0"
sdk_api_version = 1
entry_point = "plugin:register"

[scopes]
grants = ["graph.read", "graph.mutate"]

[frontend]
view = "generic"

[persistence]
passive_node_kinds = ["workbench"]
