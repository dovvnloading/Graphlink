[plugin]
id = "science_pharmacokinetics"
name = "Pharmacokinetics"
description = "Analyze single- and multiple-dose PK, BSA human-equivalent dose scaling, and Bliss/Chou-Talalay drug combinations."
version = "1.2.0"
sdk_api_version = 1
entry_point = "plugin:register"

[scopes]
grants = ["graph.read", "graph.mutate"]

[frontend]
view = "generic"

[persistence]
passive_node_kinds = ["workbench"]

[scientific]
family = "biology"
