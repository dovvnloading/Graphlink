[plugin]
id = "science_genetics"
name = "Genetics"
description = "Analyze Mendelian segregation, Hardy–Weinberg equilibrium, linkage, F-statistics, LD, drift, selection, heritability and effective size."
version = "1.2.0"
sdk_api_version = 1
entry_point = "plugin:register"

[scopes]
grants = ["graph.read", "graph.mutate"]

[frontend]
view = "generic"

[persistence]
passive_node_kinds = ["workbench"]

[scientific]
family = "biology"
