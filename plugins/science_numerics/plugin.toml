[plugin]
id = "science_numerics"
name = "Numerical Methods"
description = "Adaptive ODE IVPs (RK45 and implicit stiff), Brent roots, Gauss-Kronrod quadrature and cubic splines."
version = "1.1.0"
sdk_api_version = 1
entry_point = "plugin:register"

[scopes]
grants = ["graph.read", "graph.mutate"]

[frontend]
view = "generic"

[persistence]
passive_node_kinds = ["workbench"]
