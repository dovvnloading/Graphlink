[plugin]
id = "science_plate_assays"
name = "Plate Assays"
description = "Map 96/384-well assay plates, calibrate standards from linear to 5PL, quantify diluted unknowns and evaluate assay quality."
version = "1.2.0"
sdk_api_version = 1
entry_point = "plugin:register"

[scopes]
grants = ["graph.read", "graph.mutate"]

[frontend]
view = "generic"

[persistence]
passive_node_kinds = ["workbench"]

[scientific]
family = "biology"
