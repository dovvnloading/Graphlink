[plugin]
id = "science_plate_assays"
name = "Plate Assays"
description = "Analyze plate assays, qPCR standard curves and expression, digital PCR Poisson copies, and A260 nucleic-acid purity."
version = "1.2.0"
sdk_api_version = 1
entry_point = "plugin:register"

[scopes]
grants = ["graph.read", "graph.mutate"]

[frontend]
view = "generic"

[persistence]
passive_node_kinds = ["workbench"]

[scientific]
family = "biology"
