[plugin]
id = "science_enzyme_kinetics"
name = "Enzyme Kinetics"
description = "Fit enzyme inhibition, binding isotherms, Morrison tight binding, Schild antagonism and thermal-shift Tm; calculate kcat, Hill saturation and Cheng-Prusoff Ki."
version = "1.2.0"
sdk_api_version = 1
entry_point = "plugin:register"

[scopes]
grants = ["graph.read", "graph.mutate"]

[frontend]
view = "generic"

[persistence]
passive_node_kinds = ["workbench"]

[scientific]
family = "biology"
