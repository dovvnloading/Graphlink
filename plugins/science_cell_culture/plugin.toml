[plugin]
id = "science_cell_culture"
name = "Cell Culture"
description = "Calculate cell counts, CFU plate counts, MPN, growth curves and doubling time, plus seeding, dilutions and centrifuge conversion."
version = "1.2.0"
sdk_api_version = 1
entry_point = "plugin:register"

[scopes]
grants = ["graph.read", "graph.mutate"]

[frontend]
view = "generic"

[persistence]
passive_node_kinds = ["workbench"]

[scientific]
family = "biology"
