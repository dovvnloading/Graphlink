[plugin]
id = "science_environment"
name = "Environmental Science"
description = "EPA AQI, plume dispersion, river oxygen, pollutant decay, runoff, FAO-56 evapotranspiration and trends."
version = "1.2.0"
sdk_api_version = 1
entry_point = "plugin:register"

[scopes]
grants = ["graph.read", "graph.mutate"]

[frontend]
view = "generic"

[persistence]
passive_node_kinds = ["workbench"]
