[plugin]
id = "science_expression"
name = "Gene Expression"
description = "Normalize RNA-seq count matrices and explore two-group differential expression with BH FDR volcano plots."
version = "1.2.0"
sdk_api_version = 1
entry_point = "plugin:register"

[scopes]
grants = ["graph.read", "graph.mutate"]

[frontend]
view = "generic"

[persistence]
passive_node_kinds = ["workbench"]

[scientific]
family = "biology"
