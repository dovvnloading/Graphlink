[plugin]
id = "science_biology"
name = "Biology and Ecology"
description = "Analyze community diversity and quadrat surveys; fit growth, enzyme and dose-response curves; model predator–prey ecology, genetics and survival."
version = "1.2.0"
sdk_api_version = 1
entry_point = "plugin:register"

[scopes]
grants = ["graph.read", "graph.mutate"]

[frontend]
view = "generic"

[persistence]
passive_node_kinds = ["workbench"]

[scientific]
family = "biology"
