[plugin]
id = "science_biology"
name = "Biology and Ecology"
description = "Fit biological growth, enzyme and dose-response curves; simulate ecology; test genetics, survival and biodiversity."
version = "1.1.0"
sdk_api_version = 1
entry_point = "plugin:register"

[scopes]
grants = ["graph.read", "graph.mutate"]

[frontend]
view = "generic"

[persistence]
passive_node_kinds = ["workbench"]

[scientific]
family = "biology"
