[plugin]
id = "science_signals"
name = "Signal Processing"
description = "Smooth, transform and resample measured signals."
version = "1.1.0"
sdk_api_version = 1
entry_point = "plugin:register"

[scopes]
grants = ["graph.read", "graph.mutate"]

[frontend]
view = "generic"

[persistence]
passive_node_kinds = ["workbench"]
