[plugin]
id = "science_signals"
name = "Signal Processing"
description = "FFT spectra, Welch PSD, zero-phase filtering, smoothing, peaks and resampling."
version = "1.1.0"
sdk_api_version = 1
entry_point = "plugin:register"

[scopes]
grants = ["graph.read", "graph.mutate"]

[frontend]
view = "generic"

[persistence]
passive_node_kinds = ["workbench"]
