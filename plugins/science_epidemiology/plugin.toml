[plugin]
id = "science_epidemiology"
name = "Epidemiology and Biostatistics"
description = "Analyze epidemiologic risks, stratified Mantel-Haenszel effects, meta-analysis, survival and Cox regression, diagnostics and incidence rates."
version = "1.2.0"
sdk_api_version = 1
entry_point = "plugin:register"

[scopes]
grants = ["graph.read", "graph.mutate"]

[frontend]
view = "generic"

[persistence]
passive_node_kinds = ["workbench"]

[scientific]
family = "biology"
