[plugin]
id = "science_fitting"
name = "Fitting and Inference"
description = "Weighted and nonlinear fits, Welch tests and chi-square goodness-of-fit."
version = "1.1.0"
sdk_api_version = 1
entry_point = "plugin:register"

[scopes]
grants = ["graph.read", "graph.mutate"]

[frontend]
view = "generic"

[persistence]
passive_node_kinds = ["workbench"]
