[plugin]
id = "science_earth"
name = "Earth Science"
description = "WGS84 geodesics and UTM, isotope ages, groundwater, earthquake statistics, standard atmosphere and solar position."
version = "1.1.0"
sdk_api_version = 1
entry_point = "plugin:register"

[scopes]
grants = ["graph.read", "graph.mutate"]

[frontend]
view = "generic"

[persistence]
passive_node_kinds = ["workbench"]
