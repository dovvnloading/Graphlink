[plugin]
id = "science_physiology"
name = "Physiology"
description = "Nernst and GHK membrane potentials, passive RC properties, Hodgkin-Huxley spikes, threshold detection and Fick diffusion."
version = "1.2.0"
sdk_api_version = 1
entry_point = "plugin:register"

[scopes]
grants = ["graph.read", "graph.mutate"]

[frontend]
view = "generic"

[persistence]
passive_node_kinds = ["workbench"]

[scientific]
family = "biology"
